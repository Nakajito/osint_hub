services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - search_data:/app/data/search_results
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build: .
    env_file: .env
    command: celery -A osint_hub worker --loglevel=info
    volumes:
      - media_data:/app/media
      - search_data:/app/data/search_results
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redispass} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-osinthub}
      POSTGRES_USER: ${DB_USER:-osinthub}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-osinthub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
  search_data:
