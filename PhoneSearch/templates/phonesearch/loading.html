{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="card shadow-sm p-5">
        <div class="card-body">
            <h2 class="card-title mb-4">Buscando Información...</h2>
            
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Cargando...</span>
            </div>
            
            <p class="mt-3 lead">Estamos consultando bases de datos OSINT.</p>
            <p class="text-muted">Esto puede tomar unos segundos. Por favor espera.</p>
            
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const checkStatus = () => {
                        fetch(window.location.href, {
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.ready) {
                                window.location.reload();
                            } else {
                                setTimeout(checkStatus, 2000); // Reintentar cada 2 segundos
                            }
                        })
                        .catch(error => console.error('Error:', error));
                    };
                    
                    setTimeout(checkStatus, 2000);
                });
            </script>
        </div>
    </div>
</div>
{% endblock %}
