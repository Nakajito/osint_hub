services:
  # Web Service (Django)
  - type: web
    name: osint-hub
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn osint_hub.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: osint-hub-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false

  # Database (PostgreSQL)
  - type: postgres
    name: osint-hub-db
    databaseName: osint_hub
    user: osint_hub_user
    plan: free
