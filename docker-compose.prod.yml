# Coolify deployment — Traefik manages TLS and routing
services:
  web:
    build: .
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=osint_hub.settings
    volumes:
      - media_data:/app/media
      - search_data:/app/data/search_results
      - deepface_weights:/app/.deepface
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always
    networks:
      - coolify

  celery_worker:
    build: .
    env_file: .env.prod
    command: celery -A osint_hub worker --loglevel=info
    volumes:
      - media_data:/app/media
      - search_data:/app/data/search_results
      - deepface_weights:/app/.deepface
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - coolify

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  postgres_data:
  media_data:
  search_data:
  deepface_weights:
